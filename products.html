<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopEase - Explore electronics, fashion, accessories and home products."
    >

    <title>ShopEase | Products</title>

    <link rel="stylesheet" href="cssstyle.css">
    <link rel="stylesheet" href="products.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="navbar">

    <div class="logo">
        🛍️ Shop<span>Ease</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a
            href="products.html"
            class="active"
        >
            Products
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>

    <div class="nav-buttons">

        <button
            class="search-icon"
            onclick="document.getElementById('searchInput').focus()"
        >
            🔎
        </button>

        <a href="cart.html" class="cart">

            🛒

            <span id="cart-count">
                0
            </span>

        </a>

    </div>

</header>


<!-- ================= PRODUCTS ================= -->

<main class="products-page">

    <section class="products-heading">

        <div>

            <p class="small-title">
                SHOP WITH US
            </p>

            <h1>
                Explore Our Products
            </h1>

            <p>
                Discover quality products at amazing prices.
            </p>

        </div>

        <div class="product-count">

            <strong id="productCount">
                0
            </strong>

            <span>
                Products
            </span>

        </div>

    </section>


    <!-- ================= SEARCH ================= -->

    <section class="search-section">

        <div class="search-box">

            <span>
                🔎
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                autocomplete="off"
            >

        </div>

        <select id="sortSelect">

            <option value="default">
                Sort By
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

            <option value="rating">
                Highest Rated
            </option>

        </select>

    </section>


    <!-- ================= FILTERS ================= -->

    <div class="filters">

        <button
            class="filter active"
            data-category="All"
        >
            All
        </button>

        <button
            class="filter"
            data-category="Electronics"
        >
            💻 Electronics
        </button>

        <button
            class="filter"
            data-category="Fashion"
        >
            👟 Fashion
        </button>

        <button
            class="filter"
            data-category="Accessories"
        >
            🎧 Accessories
        </button>

        <button
            class="filter"
            data-category="Home"
        >
            🏠 Home
        </button>

    </div>


    <!-- ================= PRODUCTS GRID ================= -->

    <section>

        <div
            id="product-list"
            class="product-grid"
        ></div>

        <div id="noProducts" class="no-products" >
            <div>
                🔍
            </div>

            <h2>
                No Products Found
            </h2>

            <p>
                Try another search or category.
            </p>

        </div>

    </section>
</main>
<footer>
    <div class="footer-logo">
        🛍️ Shop<span>Ease</span>
    </div>
    <p>
        Quality products. Simple shopping.
    </p>
    <p>
        © 2026 ShopEase. All Rights Reserved.
    </p>
</footer>
<script src="jsproducts.js"></script>
<script src="jsapp.js"></script>
</body>
</html>
